################### MONITORS ################### 
monitor = eDP-1, preferred, auto, 1 
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1 
source = ~/.cache/wal/colors-hyprland.conf 
exec-once = wal -R 

###################### PROGRAMS ###################### 
$terminal = kitty 
$fileManager = dolphin 
$menu = wofi --show drun 

exec-once = hyprpaper 
exec-once = mako 
exec-once = hypridle 
exec-once = waybar 
exec-once = xdg-desktop-portal 
exec-once = xdg-desktop-portal-gtk 
exec-once = wl-paste --watch cliphist store 
exec-once = pkill -f nm-applet || nm-applet --indicator 
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,gpg 

################################ ENVIRONMENT VARIABLES ################################ 
env = XCURSOR_SIZE,20 
env = QT_QPA_PLATFORMTHEME,qt6ct 
env = HYPRCURSOR_SIZE,20 
env = LANG,pl_PL.UTF-8 
env = LC_TIME,pl_PL.UTF-8 
env = SWAYSOCK, $XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket.sock 
env = MOZ_ENABLE_WAYLAND,1 

######################## LOOK AND FEEL ######################## 
general { 
    gaps_in = 12 
    gaps_out = 20 
    border_size = 2 
    col.active_border = $foreground 
    col.inactive_border = $color12 
    resize_on_border = false 
    allow_tearing = false 
    layout = dwindle 
} 

decoration { 
    rounding = 10 
    rounding_power = 2 
    active_opacity = 1.0 
    inactive_opacity = 1.0 

    shadow { 
        enabled = true 
        range = 10 
        render_power = 4 
        color = rgba(1a1a1aee) 
    } 

    blur { 
        enabled = true 
        size = 2 
        passes = 4 
        ignore_opacity = false 
        xray = false 
    } 
} 

animations { 
    enabled = yes 
    bezier = easeOutQuint,0.23,1,0.32,1 
    bezier = easeInOutCubic,0.65,0.05,0.36,1 
    bezier = linear,0,0,1,1 
    bezier = almostLinear,0.5,0.5,0.75,1.0 
    bezier = quick,0.15,0,0.1,1 

    animation = global, 1, 10, default 
    animation = border, 1, 5.39, easeOutQuint 
    animation = windows, 1, 4.79, easeOutQuint 
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87% 
    animation = windowsOut, 1, 1.49, linear, popin 87% 
    animation = fadeIn, 1, 1.73, almostLinear 
    animation = fadeOut, 1, 1.46, almostLinear 
    animation = fade, 1, 3.03, quick 
    animation = layers, 1, 3.81, easeOutQuint 
    animation = layersIn, 1, 4, easeOutQuint, fade 
    animation = layersOut, 1, 1.5, linear, fade 
    animation = fadeLayersIn, 1, 1.79, almostLinear 
    animation = fadeLayersOut, 1, 1.39, almostLinear 
    animation = workspaces, 1, 1.94, almostLinear, slide 
    animation = workspacesIn, 1, 1.94, almostLinear, slide 
    animation = workspacesOut, 1, 1.94, almostLinear, slide 
} 

dwindle { 
    preserve_split = true 
} 

master { 
    new_status = master 
} 

misc { 
    force_default_wallpaper = -1 
    disable_hyprland_logo = true 
} 

################ INPUT ################ 
input { 
    kb_layout = us 
    kb_variant = colemak 
    kb_model = 
    kb_options = 
    kb_rules = 
    follow_mouse = 1 
    sensitivity = 0 
    touchpad { 
        natural_scroll = true 
    } 
} 

device { 
    name = epic-mouse-v1 
    sensitivity = 5 
} 

###################### KEYBINDINGS ###################### 
$mainMod = SUPER 
bind = $mainMod, Q, exec, $terminal 
bind = $mainMod, A, killactive 
bind = $mainMod SHIFT, M, exit 
bind = $mainMod, E, exec, $fileManager 
bind = $mainMod, Z, togglefloating 
bind = $mainMod, P, pseudo 
bind = $mainMod, J, layoutmsg, togglesplit 
bind = $mainMod, period, exec, rofi -modi emoji -show emoji  
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "" | cliphist decode | wl-copy && wl-paste --no-newline 

bind = $mainMod, K, exec, ~/.config/hypr/scripts/toggle_idle.sh  
bind = $mainMod, I, exec, kitty -e nmtui 
bind = $mainMod, B, exec, blueman-manager 

bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2 
bind = $mainMod, 3, workspace, 3 
bind = $mainMod, 4, workspace, 4 
bind = $mainMod, 5, workspace, 5 
bind = $mainMod, 6, workspace, 6 
bind = $mainMod, 7, workspace, 7 
bind = $mainMod, 8, workspace, 8 
bind = $mainMod, 9, workspace, 9 
bind = $mainMod, 0, workspace, 10 

bind = $mainMod SHIFT, 1, movetoworkspace, 1 
bind = $mainMod SHIFT, 2, movetoworkspace, 2 
bind = $mainMod SHIFT, 3, movetoworkspace, 3 
bind = $mainMod SHIFT, 4, movetoworkspace, 4 
bind = $mainMod SHIFT, 5, movetoworkspace, 5 
bind = $mainMod SHIFT, 6, movetoworkspace, 6 
bind = $mainMod SHIFT, 7, movetoworkspace, 7 
bind = $mainMod SHIFT, 8, movetoworkspace, 8 
bind = $mainMod SHIFT, 9, movetoworkspace, 9 
bind = $mainMod SHIFT, 0, movetoworkspace, 10 

bind = $mainMod CTRL, left, movefocus, l 
bind = $mainMod CTRL, right, movefocus, r 
bind = $mainMod CTRL, up, movefocus, u 
bind = $mainMod CTRL, down, movefocus, d  

bind = SUPER SHIFT, left, resizeactive, -50 0 
bind = SUPER SHIFT, right, resizeactive, 50 0 
bind = SUPER SHIFT, up, resizeactive, 0 -50 
bind = SUPER SHIFT, down, resizeactive, 0 50 

bind = SUPER ALT, left, moveactive, -50 0 
bind = SUPER ALT, right, moveactive, 50 0 
bind = SUPER ALT, up, moveactive, 0 -50 
bind = SUPER ALT, down, moveactive, 0 50 

bind = SUPER, Tab, cyclenext 
bind = $mainMod, RETURN, fullscreen 

binde = , XF86MonBrightnessUp, exec, brightnessctl set +5% 
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- 

binde = , XF86AudioRaiseVolume, exec, pamixer --increase 5 
binde = , XF86AudioLowerVolume, exec, pamixer --decrease 5 
bind = , XF86AudioMute, exec, pamixer --toggle-mute 

bind = $mainMod SHIFT, period, swapnext 
bind = $mainMod SHIFT, C, centerwindow 

bindm = $mainMod, mouse:272, movewindow 
bindm = $mainMod, mouse:273, resizewindow 

################## SCRIPTS ################## 
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area_copy 
bind = $mainMod, X, exec, ~/.config/hypr/scripts/powermenu_pywal.sh 
bind = $mainMod, S, exec, rofi -show drun 

################################# WINDOWS AND WORKSPACES ################################# 
windowrule = float 1, match:initial_class ^(GitHub Desktop)$
windowrule = suppress_event maximize, match:initial_class .*
windowrule = no_focus 1, match:initial_class ^$, match:initial_title ^$, match:xwayland 1, match:floating 1, match:fullscreen 0, match:pinned 0

windowrule = opacity 0.7 0.7, match:initial_class ^(Spotify)$
windowrule = no_rounding 1, match:initial_class ^(waybar)$

windowrule = float 1, match:initial_class ^(dialog)$
windowrule = center 1, match:initial_class ^(dialog)$

